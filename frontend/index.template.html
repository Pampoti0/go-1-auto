<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeCho Agent</title>
<link rel="icon" type="image/png" href="/static/decho.png">
<link rel="apple-touch-icon" href="/static/decho.png">
<link rel="stylesheet" href="/static/dist/tailwind.css">
<style>
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(120,130,150,.35);border-radius:4px}
/* Con trỏ chuột tuỳ biến — bình thường + lúc click (ảnh ≤128px mới được trình duyệt chấp nhận) */
html,body{cursor:url('/static/cursor-normal-48.png?v=3') 13 2,auto!important}
button,a,summary,label,select,[role=button],.cursor-pointer{cursor:url('/static/cursor-normal-48.png?v=3') 13 2,pointer!important}
*:active{cursor:url('/static/cursor-click-48.png?v=3') 13 2,auto!important}
input,textarea,[contenteditable=true],input:active,textarea:active{cursor:text!important}
.md b{font-weight:700}
.md code{background:rgba(120,130,150,.15);border:1px solid rgba(120,130,150,.25);border-radius:5px;padding:1px 5px;font-size:12.5px;font-family:ui-monospace,monospace}
.md pre.cb{background:rgba(120,130,150,.13);border:1px solid rgba(120,130,150,.25);border-radius:8px;padding:9px 11px;margin:7px 0;font-size:12px;line-height:1.55;font-family:ui-monospace,monospace;white-space:pre;overflow-x:auto;max-width:100%}
.md table{border-collapse:collapse;margin:8px 0;font-size:12.5px;display:block;max-width:100%;overflow-x:auto;white-space:nowrap}
.md th,.md td{border:1px solid rgba(120,130,150,.28);padding:4px 11px;text-align:right}
.md th:first-child,.md td:first-child{text-align:left}
.md thead th{background:rgba(120,130,150,.13);font-weight:700}
.emoji-svg-icon{display:inline-block;width:1em;height:1em;vertical-align:-.16em;margin:0 .05em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:767px){
  .mobile-shell{height:100dvh}
  .chat-chipbar{flex-wrap:nowrap!important;overflow-x:auto;overscroll-behavior-x:contain;padding:10px 12px!important;gap:8px!important}
  .chat-chipbar::-webkit-scrollbar{display:none}
  .chat-chipbar button{flex:0 0 auto;white-space:nowrap;font-size:12px!important;padding:7px 10px!important}
  .chat-scroll-inner{padding:12px 10px 18px!important;gap:12px!important}
  .chat-row{gap:8px!important}
  .chat-avatar{width:28px!important;height:28px!important}
  .chat-bubble-wrap{max-width:calc(100% - 42px)!important}
  .chat-bubble{font-size:13.5px!important;line-height:1.55!important;padding:10px 12px!important;border-radius:16px!important}
  .chat-composer-wrap{padding:8px 12px calc(10px + env(safe-area-inset-bottom))!important}
  .chat-composer{gap:6px!important;padding:6px!important;border-radius:18px!important}
  .composer-icon,.composer-send{width:38px!important;height:38px!important;border-radius:12px!important}
  .composer-input{min-width:0!important;font-size:14px!important}
}
svg rect.bar{transition:width .6s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg-in{animation:up .25s ease}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.dot1,.dot2,.dot3{animation:blink 1.2s infinite}.dot2{animation-delay:.2s}.dot3{animation-delay:.4s}
@keyframes pop{from{opacity:0;transform:translateY(5px) scale(.97)}to{opacity:1;transform:none}}
.speech{animation:pop .22s ease}
/* DeCho pose motions */
@keyframes poseFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pose-float{animation:poseFloat 3.5s ease-in-out infinite}
@keyframes poseThink{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg) translateY(-3px)}}
.pose-think{animation:poseThink .9s ease-in-out infinite}
@keyframes poseBounce{0%{transform:translateY(0)}30%{transform:translateY(-16px) scale(1.05)}55%{transform:translateY(0) scale(.96,.93)}75%{transform:translateY(-6px)}100%{transform:translateY(0)}}
.pose-bounce{animation:poseBounce .9s ease infinite}
@keyframes poseSad{0%,100%{transform:translateY(3px) rotate(-1.2deg)}50%{transform:translateY(5px) rotate(1.2deg)}}
.pose-sad{animation:poseSad 2.2s ease-in-out infinite;filter:saturate(.8)}
</style>
<script src="/static/vendor/react.production.min.js"></script>
<script src="/static/vendor/react-dom.production.min.js"></script>
<script src="/static/vendor/particles.js"></script>
<script src="/static/vendor/three.min.js"></script>
<script src="/static/vendor/GLTFLoader.js"></script>
<script src="/static/vendor/OrbitControls.js"></script>
<script src="/static/vendor/DecalGeometry.js"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100">
<div id="particles-js" style="position:fixed;inset:0;z-index:-1;pointer-events:none"></div>
<div id="root"></div>
<script>
(function initParticles(){
  if(!window.particlesJS){return setTimeout(initParticles,200)}
  particlesJS('particles-js',{
    particles:{
      number:{value:200,density:{enable:true,value_area:800}},
      color:{value:['#ffffff','#dbeafe','#fde68a','#bfdbfe']},
      shape:{type:'circle'},
      opacity:{value:0.9,random:true,anim:{enable:true,speed:1.4,opacity_min:0.05,sync:false}},
      size:{value:1.8,random:true,anim:{enable:true,speed:2,size_min:0.3,sync:false}},
      line_linked:{enable:false},
      move:{enable:true,speed:0.35,direction:'none',random:true,straight:false,out_mode:'out',bounce:false}
    },
    interactivity:{detect_on:'window',events:{
      onhover:{enable:true,mode:'bubble'},
      onclick:{enable:true,mode:'repulse'},
      resize:true
    },modes:{bubble:{distance:140,size:4,duration:2,opacity:1},repulse:{distance:120,duration:0.4}}},
    retina_detect:true
  });
})();
</script>

<script src="/static/dist/app.js"></script>
</body>
</html>
